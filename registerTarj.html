<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Money</title>
    <link rel="icon" href="src/icons/attach_money_green_24dpx.png" />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/header.css" />
    <link rel="stylesheet" href="style/regGast.css" />
  </head>
  <body>
    <header>
      <h1 id="title">
        <img src="src/img/logo-my-money-red.png" alt="Name page: My Money" />
      </h1>
      <nav class="menuList">
        <!-- Navegacion del sitio -->
        <div class="borderImgButton">
          <a href="index.html" title="Inicio">
            <img class="imgMenuNav" src="src/icons/pagina-de-inicio.png"
          /></a>
        </div>
        <div class="borderImgButton">
          <a href="registerGast.html" title="Registro de gastos">
            <img class="imgMenuNav" src="src/icons/save-money_8016580.png"
          /></a>
        </div>
        <div class="borderImgButton">
          <a href="registerTarj.html" title="Registro de tarjetas">
            <img class="imgMenuNav" src="src/icons/add_card_512dp.png"
          /></a>
        </div>
      </nav>
    </header>
    <main>
      <section>
        <h2 id="welcome">Registro de tarjetas</h2>
        <form>
          <div class="form">
            <p>Alias de la tarjeta</p>
            <input type="text" />
            <p>Banco</p>
            <select name="" id="">
              <option value="bbva">BBVA</option>
            </select>
            <p>Numero de cuenta o clave interbancaria</p>
            <input type="number" name="" id="" />
            <p>Tipo de tarjeta</p>
            <select name="" id="">
              <option value="debit">Debito</option>
            </select>
          </div>
          <button id="submit" type="submit">Registrar tarjeta</button>
        </form>
      </section>
    </main>
    <footer>Pie de paginaa</footer>
  </body>
</html>
