<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Money</title>
    <link rel="icon" href="src/icons/attach_money_green_24dpx.png" />
    <link rel="stylesheet" href="style/style.css" />
    <link rel="stylesheet" href="style/header.css" />
    <link rel="stylesheet" href="style/regGast.css" />
    <!-- Scripts -->
    <script src="script/app.js" defer></script>
  </head>
  <body>
    <header>
      <h1 id="title">
        <img src="src/img/logo-my-money-red.png" alt="Name page: My Money" />
      </h1>
      <nav class="menuList">
        <!-- Navegacion del sitio -->
        <div class="borderImgButton">
          <a href="index.html" title="Inicio">
            <img class="imgMenuNav" src="src/icons/pagina-de-inicio.png"
          /></a>
        </div>
        <div class="borderImgButton">
          <a href="registerGast.html" title="Registro de gastos">
            <img class="imgMenuNav" src="src/icons/save-money_8016580.png"
          /></a>
        </div>
        <div class="borderImgButton">
          <a href="registerTarj.html" title="Registro de tarjetas">
            <img class="imgMenuNav" src="src/icons/add_card_512dp.png"
          /></a>
        </div>
      </nav>
    </header>
    <main>
      <section id="section">
        <h2 id="welcome">Registro de gastos</h2>
        <div id="regGastResGast">
          <form id="dataRegister" onsubmit="return false;">
            <!-- = Aqui se detiene el envio del formulario -->
            <div class="form">
              <p>Ingresa monto gastado:</p>
              <input
                id="montGast"
                type="number"
                placeholder="Ingrese monto gastado"
                min="0"
                step="0.01"
              />
              <p>Ingresa descripcion del gasto:</p>
              <input id="description" type="text" placeholder="Descripcion" />
              <p>Seleccione tarjeta donde se realizo el gasto:</p>
              <select id="cards">
                <!-- Tarjetas -->
                <option value="bbva">BBVA</option>
                <option value="stori">Stori</option>
              </select>
              <p>Seleccione categoria de gasto:</p>
              <select id="categories">
                <!-- Catergorias -->
                <option value="food">Comida</option>
                <option value="health">Salud</option>
              </select>
            </div>
            <button id="submit" type="submit" onclick="regGasto()">
              Registrar gasto
            </button>
          </form>
          <div id="resumeExpensives">
            <h3>Total gastado $ <span id="totalExpensive">0</span></h3>
            <ul id="allExpensives"></ul>
            <button id="reset">Borrar gastos guardados</button>
          </div>
        </div>
      </section>
    </main>
    <footer>Pie de paginaa</footer>
  </body>
</html>
